[workspace]
resolver = "2"
members = [
    "crates/codebrain-cli",
    "crates/codebrain-core",
    "crates/codebrain-db",
    "crates/codebrain-embed",
    "crates/codebrain-mcp",
    "crates/codebrain-connector",
    "crates/codebrain-connector-code",
    "crates/codebrain-connector-obsidian",
    "crates/codebrain-connector-saas",
]
default-members = ["crates/codebrain-cli"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["CodeBrain Contributors"]
repository = "https://github.com/codebrain/codebrain"

[workspace.dependencies]
# Internal
codebrain-cli = { path = "crates/codebrain-cli" }
codebrain-core = { path = "crates/codebrain-core" }
codebrain-db = { path = "crates/codebrain-db" }
codebrain-embed = { path = "crates/codebrain-embed" }
codebrain-mcp = { path = "crates/codebrain-mcp" }
codebrain-connector = { path = "crates/codebrain-connector" }
codebrain-connector-code = { path = "crates/codebrain-connector-code" }
codebrain-connector-obsidian = { path = "crates/codebrain-connector-obsidian" }
codebrain-connector-saas = { path = "crates/codebrain-connector-saas" }

# External
anyhow = "1"
async-trait = "0.1"
blake3 = "1.8.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
figment = { version = "0.10", features = ["toml", "env"] }
fastembed = "5.17"
ignore = "=0.4.30"
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
surrealdb = { version = "2.3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.26.11"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
